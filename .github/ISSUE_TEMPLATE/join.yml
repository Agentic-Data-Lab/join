name: 申请加入 Agentic Data Lab 组织
description: 提交后由管理员核对，通过后会收到 GitHub 邀请邮件（7 天内有效）
title: "[申请加入] "
labels: ["join-request"]
body:
  - type: markdown
    attributes:
      value: |
        ## 加入后你能拿到什么

        - **只读**访问组织内的仓库（目前主要是 `server_info`——服务器文档）；
        - 仓库里的 `docs/*.md` 就是文档站各页的 Markdown 原文，**适合让你的 agent 直接读取**；
        - 其他实验室资源请从 <https://panel.jianke-yu.online/> 进入。

        提交后管理员会核对并处理；通过后你会收到 GitHub 邀请邮件（**7 天内有效**）。
        提交前请读一遍 [只读使用规范](https://github.com/Agentic-Data-Lab/join/blob/main/usage-policy.md)。

        ---
  - type: input
    id: name_cn
    attributes:
      label: 中文姓名
      description: 管理员按名字核对，请写全名
      placeholder: 许张祎
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 补充说明（可选）
      description: 需要读什么内容、打算怎么用（例如"让 agent 自动拉取服务器文档"）
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已阅读并同意《只读使用规范》：组织内 private 仓库的内容一律不得对外传播
          required: true
        - label: 我知道加入后是只读权限，不会尝试修改仓库内容
          required: true
