name: 邀请申请者加入组织

# 流程：同学提交「申请加入」issue → 管理员核对后加 approved 标签 → 本工作流发组织邀请，并直接放进只读团队
# 安全设计：
#   1) 只有能编辑本仓库的人（= 管理员）才能加 approved 标签，外人无法自助入组；
#   2) 工作流不 checkout、不执行 issue 里的任何内容，只调 API；
#   3) 组织级操作只用最小权限令牌（secret: ORG_ADMIN_TOKEN），仓库级操作（回帖/标签/关闭）用默认 GITHUB_TOKEN。

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  invite:
    if: github.event.label.name == 'approved' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      # 仓库内的 composite action（./.github/actions/...）必须先 checkout 才能用。
      # 本工作流只由 issues 事件触发，检出的是默认分支上的自有代码，不涉及不可信内容；
      # 若将来给本仓库加 pull_request 触发器，务必先去掉这一步或改为不检出。
      - name: Checkout（仅为了使用仓库内的 composite action）
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 解析只读团队（按 slug 或显示名，避免 slug 猜错）
        id: team
        uses: ./.github/actions/resolve-team
        with:
          org: ${{ vars.ORG_NAME || 'Agentic-Data-Lab' }}
          token: ${{ secrets.ORG_ADMIN_TOKEN }}
          slug: ${{ vars.TEAM_SLUG || 'basic-team' }}
          name: ${{ vars.TEAM_NAME || 'Basic Team' }}

      - name: 确保标签存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for L in "join-request:1f6feb" "approved:0e8a16" "invited:5319e7" "rejected:b60205"; do
            name="${L%%:*}"; color="${L##*:}"
            curl -sS -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/labels" \
              -d "{\"name\":\"$name\",\"color\":\"$color\"}" || true
          done

      - name: 发出组织邀请
        env:
          ORG_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ vars.ORG_NAME || 'Agentic-Data-Lab' }}
          TEAM_SLUG: ${{ steps.team.outputs.slug }}
          TEAM_ID: ${{ steps.team.outputs.id }}
          LOGIN: ${{ github.event.issue.user.login }}
          USER_ID: ${{ github.event.issue.user.id }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API=/tmp/api.json
          api() {
            curl -sS -o "$API" -w '%{http_code}' \
              -H "Authorization: Bearer $ORG_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          echo "将邀请 @$LOGIN ($USER_ID) 加入 $ORG，并放进团队 $TEAM_SLUG (id=$TEAM_ID)"

          code=$(api -X POST "https://api.github.com/orgs/$ORG/invitations" \
                 -d "{\"invitee_id\": $USER_ID, \"role\": \"direct_member\", \"team_ids\": [$TEAM_ID]}")
          case "$code" in
            201) MSG="@$LOGIN 已发出组织邀请，请到邮箱点接受（**7 天内有效**，过期请在此回帖让我重发）。接受后你就自动在 \`$TEAM_SLUG\` 团队里，拥有只读权限。" ;;
            204|422) MSG="@$LOGIN 你已经是组织成员（或已有待接受的邀请），无需重复申请。" ;;
            *) MSG="邀请失败（HTTP $code）：$(jq -rc '.message? // .' "$API" 2>/dev/null | head -c 200)"; echo "::error::$MSG"; exit 1 ;;
          esac

          curl -sS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE/comments" \
            -d "$(jq -nc --arg b "$MSG" '{body:$b}')"
          curl -sS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE/labels" -d '{"labels":["invited"]}'
          curl -sS -o /dev/null -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE" -d '{"state":"closed"}'
          echo "已回帖、打标签并关闭 issue #$ISSUE"
