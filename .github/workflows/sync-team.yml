name: 同步只读团队（兜底）

# 保证「组织成员 = 只读团队成员」这个不变量：走申请流程的邀请会带 team_ids，
# 本工作流每周兜底扫描，把不在团队里的组织成员补齐进去（只加不删）。
# 每个 API 调用都打印状态码与错误消息，失败时能直接定位。
on:
  schedule:
    - cron: '30 1 * * 1'      # 每周一 09:30（北京时间）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 仓库内的 composite action（./.github/actions/...）必须先 checkout 才能用。
      # 本工作流只由 issues 事件触发，检出的是默认分支上的自有代码，不涉及不可信内容；
      # 若将来给本仓库加 pull_request 触发器，务必先去掉这一步或改为不检出。
      - name: Checkout（仅为了使用仓库内的 composite action）
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 解析只读团队
        id: team
        uses: ./.github/actions/resolve-team
        with:
          org: ${{ vars.ORG_NAME || 'Agentic-Data-Lab' }}
          token: ${{ secrets.ORG_ADMIN_TOKEN }}
          slug: ${{ vars.TEAM_SLUG || 'basic-team' }}
          name: ${{ vars.TEAM_NAME || 'Basic Team' }}

      - name: 把组织成员补齐到只读团队
        env:
          ORG_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ vars.ORG_NAME || 'Agentic-Data-Lab' }}
          TEAM_SLUG: ${{ steps.team.outputs.slug }}
        run: |
          set -uo pipefail
          API=/tmp/api.json
          MEMBERS=/tmp/members.txt
          TEAM=/tmp/team.txt
          : > "$MEMBERS"; : > "$TEAM"

          echo "ORG = $ORG，TEAM_SLUG = $TEAM_SLUG"

          CURL_OPTS=(--max-time 25 --retry 2 --retry-delay 2 --retry-connrefused)
          code_of() {
            curl -sS "${CURL_OPTS[@]}" -o "$API" -w '%{http_code}' \
              -H "Authorization: Bearer $ORG_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com$1"
          }
          fail() { echo "::error::$1（HTTP $2）：$(jq -rc '.message? // .' "$API" 2>/dev/null | head -c 300)"; exit 1; }
          list_members() {
            local path="$1" out="$2" page=1 n c
            while :; do
              c=$(code_of "$path?per_page=100&page=$page")
              echo "GET $path?page=$page → HTTP $c"
              if [ "$c" != "200" ]; then
                echo "  响应: $(jq -rc '.message? // .' "$API" 2>/dev/null | head -c 200)"
                return 1
              fi
              # 必须是数组；jq 解析失败也算失败（绝不让它悄悄变成空值继续翻页）
              if ! n=$(jq -er 'if type=="array" then length else empty end' "$API" 2>/dev/null); then
                echo "  响应不是数组: $(head -c 200 "$API")"
                return 1
              fi
              jq -r 'if type=="array" then .[].login else empty end' "$API" >> "$out"
              [ "$n" -lt 100 ] && break
              page=$((page+1))
              # 硬上限：正常最多几页，超过就是出问题了，宁可失败也不要空转
              if [ "$page" -gt 20 ]; then echo "分页超过 20 页，异常退出"; return 1; fi
            done
            return 0
          }

          list_members "/orgs/$ORG/members" "$MEMBERS" || fail "读不到组织成员列表：令牌需要 Organization permissions → Members: Read and write（细粒度），或经典 PAT 勾 admin:org" "${c:-?}"
          list_members "/orgs/$ORG/teams/$TEAM_SLUG/members" "$TEAM" || fail "读不到团队 $TEAM_SLUG 的成员" "${c:-?}"

          total=$(grep -c . "$MEMBERS" || true); inteam=$(grep -c . "$TEAM" || true)
          echo "组织成员数 = $total，$TEAM_SLUG 现有成员数 = $inteam"

          added=0; failed=0
          while read -r u; do
            [ -z "$u" ] && continue
            grep -qx "$u" "$TEAM" && continue
            c=$(curl -sS "${CURL_OPTS[@]}" -o "$API" -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $ORG_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/$ORG/teams/$TEAM_SLUG/memberships/$u")
            if [ "$c" = "200" ] || [ "$c" = "204" ]; then
              echo "  + 加入 $TEAM_SLUG: $u (HTTP $c)"; added=$((added+1))
            else
              echo "::warning::加入失败: $u (HTTP $c)：$(jq -rc '.message? // .' "$API" 2>/dev/null | head -c 200)"; failed=$((failed+1))
            fi
          done < "$MEMBERS"

          echo "完成：组织成员 $total，本次补齐 $added，失败 $failed"
          if [ "$failed" -gt 0 ]; then echo "::error::有 $failed 个成员补齐失败"; exit 1; fi
